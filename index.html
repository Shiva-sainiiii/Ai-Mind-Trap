<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Mind Trap | Escape the Logic</title>
  <meta name="description" content="Sawal seedhe lagte hain, jawab nahi. 100 trick sawaalon ka game. Ek galti aur phans gaye.">
  <meta name="theme-color" content="#0a2b22">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a2b22'/%3E%3Cpath transform='translate(4 4)' fill='%23d3ab5c' d='M12 2C12 2 4 9 4 14a4 4 0 0 0 7 2.6c-.2 2-1 3.6-2.5 5.4h7c-1.5-1.8-2.3-3.4-2.5-5.4A4 4 0 0 0 20 14c0-5-8-12-8-12z'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500..800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body class="page-home">

  <!-- .page rings ke overflow ko clip karta hai, taaki mobile pe side scroll na aaye -->
  <div class="page">

  <header class="topbar">
    <a class="wordmark" href="index.html">AI Mind Trap</a>
  </header>

  <main class="home">

    <section class="hero">
      <!-- Moire rings: JS se bharte hain -->
      <div class="rings" id="rings" aria-hidden="true"></div>

      <h1 class="title" aria-label="Mind Trap">
        <span class="line"><span>Mind</span></span>
        <span class="line"><span>Trap</span></span>
      </h1>

      <p class="tagline reveal" style="--d: .9s">Sawal seedhe lagte hain. Jawab nahi.</p>

      <form class="start reveal" style="--d: 1.05s" id="start-form" novalidate>
        <label class="field" for="username">
          <span class="field-label">Apna naam likho</span>
          <input id="username" name="username" type="text" maxlength="16"
                 autocomplete="nickname" autocapitalize="words" spellcheck="false"
                 placeholder="Jaise Shiva" aria-describedby="name-error">
        </label>
        <p class="field-error" id="name-error" role="alert"></p>
        <button class="btn btn-primary" type="submit" id="start-btn">Game shuru karo</button>
      </form>

      <p class="fineprint reveal" style="--d: 1.2s">100 trick sawaal. Har level pe time kam hota jata hai.</p>
    </section>

    <section class="board reveal" style="--d: 1.1s" aria-labelledby="board-title">
      <h2 id="board-title">Top 5 khiladi</h2>
      <ol class="board-list" id="board-list" aria-busy="true">
        <li class="board-row is-skeleton"><span class="bar"></span></li>
        <li class="board-row is-skeleton"><span class="bar"></span></li>
        <li class="board-row is-skeleton"><span class="bar"></span></li>
      </ol>
      <p class="board-note" id="board-note" hidden></p>
    </section>

  </main>

  <footer class="foot">Developed by Shiva Saini</footer>

  </div>

  <script type="module" src="home.js"></script>
</body>
</html>
