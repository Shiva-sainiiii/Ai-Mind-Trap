<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Playing | AI Mind Trap</title>
  <meta name="theme-color" content="#0a2b22">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a2b22'/%3E%3Cpath transform='translate(4 4)' fill='%23d3ab5c' d='M12 2C12 2 4 9 4 14a4 4 0 0 0 7 2.6c-.2 2-1 3.6-2.5 5.4h7c-1.5-1.8-2.3-3.4-2.5-5.4A4 4 0 0 0 20 14c0-5-8-12-8-12z'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500..800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body class="page-game">

  <div class="rings" id="rings" aria-hidden="true"></div>

  <!-- Card ke suit symbols (spade, heart, diamond, club) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="suit-spade" viewBox="0 0 24 24"><path d="M12 2C12 2 4 9 4 14a4 4 0 0 0 7 2.6c-.2 2-1 3.6-2.5 5.4h7c-1.5-1.8-2.3-3.4-2.5-5.4A4 4 0 0 0 20 14c0-5-8-12-8-12z"/></symbol>
    <symbol id="suit-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.4-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.6-8 11-8 11z"/></symbol>
    <symbol id="suit-diamond" viewBox="0 0 24 24"><path d="M12 2l7 10-7 10-7-10z"/></symbol>
    <symbol id="suit-club" viewBox="0 0 24 24"><path d="M12 2a4 4 0 0 0-3.4 6.1A4.5 4.5 0 1 0 11 15.8c-.2 2-1 3.6-2.5 5.4h7c-1.5-1.8-2.3-3.4-2.5-5.4a4.5 4.5 0 1 0 2.4-7.7A4 4 0 0 0 12 2z"/></symbol>
  </svg>

  <div class="shell" id="shell">

    <header class="topbar">
      <a class="wordmark" href="index.html">AI Mind Trap</a>
      <a class="link-quiet" href="index.html">Home</a>
    </header>

    <main class="game">
      <h1 class="sr-only">AI Mind Trap</h1>

      <!-- Level / Score / Timer -->
      <section class="hud" aria-label="Game status">
        <div class="stat">
          <span class="label">Level</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="stat stat-score">
          <span class="label">Score</span>
          <span class="value" id="score">0</span>
          <span class="delta" id="delta" aria-hidden="true"></span>
        </div>

        <div class="timer" id="timer" role="timer" aria-label="Bacha hua time">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle class="track" cx="32" cy="32" r="28"></circle>
            <circle class="bar" id="timer-bar" cx="32" cy="32" r="28"></circle>
          </svg>
          <span class="time" id="time">45</span>
        </div>
      </section>

      <!-- Question card -->
      <article class="card" id="card">
        <svg class="pip pip-top" id="pip-top" aria-hidden="true"><use href="#suit-spade"></use></svg>

        <h2 class="question" id="question"></h2>

        <div class="options" id="options" role="group" aria-label="Jawab ke options"></div>

        <div class="hint-wrap" id="hint-wrap">
          <div><p class="hint" id="hint" aria-live="polite"></p></div>
        </div>

        <p class="feedback" id="feedback" aria-live="polite"></p>

        <svg class="pip pip-bottom" id="pip-bottom" aria-hidden="true"><use href="#suit-spade"></use></svg>
      </article>

      <div class="actions">
        <button class="btn btn-ghost" id="hint-btn" type="button">Hint <span class="cost">-10</span></button>
        <button class="btn btn-ghost" id="skip-btn" type="button">Skip <span class="cost">-5</span></button>
      </div>
    </main>

    <footer class="foot">Developed by Shiva Saini</footer>
  </div>

  <!-- Game over -->
  <div class="overlay" id="overlay" hidden>
    <section class="card result" role="dialog" aria-modal="true" aria-labelledby="result-title">
      <h2 class="result-title" id="result-title">Trap mein phas gaye</h2>
      <p class="result-score"><span id="result-score">0</span></p>
      <p class="result-meta" id="result-level">Level 1 tak pahunche</p>
      <p class="result-meta" id="result-best"></p>
      <p class="result-save" id="result-save" aria-live="polite"></p>
      <div class="result-actions">
        <button class="btn btn-primary" id="again-btn" type="button">Dobara khelo</button>
        <a class="btn btn-ghost" href="index.html">Home</a>
      </div>
    </section>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
